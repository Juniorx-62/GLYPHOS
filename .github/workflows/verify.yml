name: verify

# The same gate as `npm run verify`, on every push and pull request:
# catalogue (strict), indexes, types, tests, dependency rules, licences and brand.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run verify
      - run: npm run build
